<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enough!</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Enough!</h1>
        <p>Local image analysis</p>
      </header>

      <dl>
        <div>
          <dt>Model</dt>
          <dd>Sieve</dd>
        </div>
        <div>
          <dt>AI blur threshold</dt>
          <dd id="threshold">Loading...</dd>
        </div>
        <div>
          <dt>Show verified C2PA AI content</dt>
          <dd id="show-verified-ai">Loading...</dd>
        </div>
        <div>
          <dt>Cached analyses</dt>
          <dd id="cache-count">Loading...</dd>
        </div>
      </dl>

      <button id="clear-cache" type="button">Clear analysis cache</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
